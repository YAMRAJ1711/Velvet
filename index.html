<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velvet &amp; Ember — 18+ Intimacy &amp; Desire Alignment</title>
  <style>
    /* =========================================================================
       ZERO-DEPENDENCY INLINE DESIGN SYSTEM (NO EXTERNAL BLOCKING FONTS OR CDNS)
       ========================================================================= */
    :root {
      --bg-base: #09050b;
      --bg-card: rgba(21, 13, 25, 0.90);
      --bg-input: rgba(10, 6, 13, 0.94);
      --border-subtle: rgba(255, 255, 255, 0.11);
      --text-main: #f8fafc;
      --text-muted: rgba(248, 224, 232, 0.74);
      --text-dim: rgba(248, 224, 232, 0.46);
      --accent: #e11d48;
      --accent-rgb: 225, 29, 72;
      --p1-hex: #e11d48;
      --p1-rgb: 225, 29, 72;
      --p2-hex: #f59e0b;
      --p2-rgb: 245, 158, 11;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", Times, serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-image:
        radial-gradient(circle at 14% 14%, rgba(var(--p1-rgb), 0.22) 0%, transparent 46%),
        radial-gradient(circle at 86% 84%, rgba(var(--p2-rgb), 0.18) 0%, transparent 48%),
        radial-gradient(circle at 50% 45%, rgba(var(--accent-rgb), 0.11) 0%, transparent 65%);
      transition: background-image 0.35s ease;
    }

    .container {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Header */
    header {
      padding: 20px 0 8px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .brand-orb {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), #701a75);
      box-shadow: 0 4px 18px rgba(var(--accent-rgb), 0.45);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg, #ffffff, #ffe4e6, #fde68a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
    }

    .pill-mature {
      background: rgba(159, 18, 57, 0.35);
      border-color: rgba(244, 63, 94, 0.42);
      color: #fda4af;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-ghost-sm {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: rgba(30, 18, 36, 0.88);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-ghost-sm:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(48, 28, 58, 0.94);
    }

    /* Main Card */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 18px 0;
    }

    .glass-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid rgba(var(--accent-rgb), 0.32);
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.78), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: fadeUp 0.28s ease forwards;
    }

    @media (max-width: 600px) {
      .glass-card {
        padding: 20px 18px;
        border-radius: 22px;
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3 {
      font-family: var(--font-serif);
      font-weight: 700;
      line-height: 1.18;
      color: #ffffff;
    }

    .hero-title {
      font-size: clamp(1.85rem, 4.5vw, 2.75rem);
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
      max-width: 610px;
    }

      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 7px;

    .text-input {
      width: 100%;
      padding: 13px 15px;
      border-radius: 15px;
      background: var(--bg-input);
      border: 1px solid rgba(var(--accent-rgb), 0.38);
      color: #ffffff;
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;

    .text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.22);

    @media (max-width: 600px) {

    .swatch-btn {

      justify-content: center;
      padding: 10px 6px;
      border-radius: 15px;
      background: rgba(11, 7, 14, 0.90);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;

      border-color: rgba(255, 255, 255, 0.32);

      color: #ffffff;
      transform: scale(1.03);
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.45);

    .swatch-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      margin-bottom: 6px;
      border: 2px solid rgba(255, 255, 255, 0.28);

      border-top: 1px solid var(--border-subtle);

    details.code-drawer summary {

      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      user-select: none;
    }

    details.code-drawer summary::-webkit-details-marker {
      display: none;
    }

    details.code-drawer summary:hover {
      color: #ffffff;
    }

    /* Quiz Options */
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 14px 0 22px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .option-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin: 20px 0 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 15px 16px;
      border-radius: 16px;
      background: rgba(11, 7, 14, 0.80);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      gap: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: rgba(var(--accent-rgb), 0.65);
      background: rgba(38, 22, 46, 0.68);
      transform: translateY(-1px);
    }

    .option-btn.selected {
      border-color: var(--accent);
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.28), rgba(16, 10, 20, 0.92));
      box-shadow: 0 0 24px rgba(var(--accent-rgb), 0.25);
    }

    .option-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .option-btn.selected .option-badge {
      background: var(--accent);
    }

    .score-ring-wrap {
      position: relative;
      width: 148px;
      height: 148px;
      margin: 16px auto;
    }

    .score-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .comparison-card {
      padding: 18px;
      border-radius: 18px;
      background: rgba(11, 7, 14, 0.84);
      border: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }

    .partner-pair-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }

    @media (max-width: 600px) {
      .partner-pair-grid {
        grid-template-columns: 1fr;
      }
    }

    .partner-choice-box {
      padding: 12px 14px;
      border-radius: 13px;
      background: rgba(24, 15, 29, 0.94);
      border: 1px solid var(--border-subtle);
    }

    /* Share Box */
    .copy-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    @media (max-width: 540px) {
      .copy-row {
        flex-direction: column;
      }
    }

    .mono-input {
      flex: 1;
      padding: 11px 13px;
      border-radius: 12px;
      background: #08050a;
      border: 1px solid var(--border-subtle);
      color: #fbcfe8;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      outline: none;
    }

    /* Modals & Toast */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(5, 3, 7, 0.92);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      width: 100%;
      max-width: 820px;
      max-height: 90vh;
      overflow-y: auto;
      background: #140c18;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .kpi-card {
      padding: 13px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
    }

    th, td {
      padding: 9px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    th {
      color: var(--text-dim);
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      background: rgba(255, 255, 255, 0.03);
    }

    #toast-box {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 340px;
      pointer-events: none;
    }

    .toast-item {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #ffffff;
      background: #1f1226;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);

    }

    footer {
      padding: 20px 0 26px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: 0.74rem;
      cursor: pointer;
    }

    .link-btn:hover {
      color: #fde68a;
    }
  </style>
</head>

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fastRandomInt(max) {
      try {
        if (window.crypto && window.crypto.getRandomValues) {
          const arr = new Uint32Array(1);
          window.crypto.getRandomValues(arr);
          return arr[0] % max;
        }
      } catch (e) {}
      return Math.floor(Math.random() * max);
    }

    function shuffleArray(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = fastRandomInt(i + 1);
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function makeRoomCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = 'VE';
      for (let i = 0; i < 6; i++) out += chars[fastRandomInt(chars.length)];
      return out;
    }

        window.localStorage.setItem(SEEN_QUESTIONS_KEY, JSON.stringify(finalSet));

    }

    function drawNonRepeatingDeck(excludeIds = []) {
      const seenIds = readSeenQuestionIds();
      const categoryOrder = shuffleArray([1, 2, 3, 4, 5]);
      const drawn = [];

      for (const cat of categoryOrder) {
        const catPool = QUESTION_BANK.filter(q => q.cat === cat);
        let candidates = catPool.filter(q => !seenIds.includes(q.id) && !excludeIds.includes(q.id));
        if (candidates.length === 0) {
          candidates = catPool.filter(q => !excludeIds.includes(q.id));
        }
        if (candidates.length === 0) {
          candidates = catPool;
        }
        const chosen = candidates[fastRandomInt(candidates.length)];
        drawn.push(chosen.id);
      }

      markQuestionsAsSeen(drawn);
      return drawn;
    }

            const cloudRows = [];
            snap.forEach(d => cloudRows.push(d.data()));
            cloudRows.sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));
            if (cloudRows.length > 0) {
              memoryTelemetry = cloudRows;
              try {
                window.localStorage.setItem(TELEMETRY_KEY, JSON.stringify(cloudRows.slice(0, 500)));
              } catch (e) {}
              if (state.vaultUnlocked) renderVault();
            }
          },
          () => {}
        );
      } catch (e) {}
    }

    /* =========================================================================
       6. COMPATIBILITY & LUST ALIGNMENT SCORING ENGINE
       ========================================================================= */
    function computeAlignment() {
      let exactCount = 0;
      let compCount = 0;

      const items = state.deckIds.map(qid => {
        const q = getQuestion(qid);
        const a1 = state.p1Answers[qid];
        const a2 = state.p2Answers[qid];
        const isExact = a1 === a2;
        let isComplementary = false;
        let compLabel = '';

        if (!isExact) {
          if (q.cat === 2 && ((a1 === 'A' && a2 === 'B') || (a1 === 'B' && a2 === 'A'))) {
            isComplementary = true;
            compLabel = 'Dom / Sub Fit';
          } else if (q.cat === 1 && ((a1 === 'A' && a2 === 'B') || (a1 === 'B' && a2 === 'A'))) {
            isComplementary = true;
            compLabel = 'High-Tension Spark';
          } else if (q.cat === 3 && ((a1 === 'A' && a2 === 'C') || (a1 === 'C' && a2 === 'A') || (a1 === 'B' && a2 === 'C') || (a1 === 'C' && a2 === 'B'))) {
            isComplementary = true;
            compLabel = 'Balanced Tempo';
          } else if (q.cat === 4 && ((a1 === 'A' && a2 === 'B') || (a1 === 'B' && a2 === 'A') || (a1 === 'B' && a2 === 'C') || (a1 === 'C' && a2 === 'B'))) {
            isComplementary = true;
            compLabel = 'Shared Curiosity';
          }
        }

        if (isExact) exactCount++;
        else if (isComplementary) compCount++;

        return { ...q, a1, a2, isExact, isComplementary, compLabel };
      });

      const pct = Math.min(100, Math.max(24, (exactCount * 20) + (compCount * 12) + ((5 - exactCount - compCount) * 4)));

      let badge = 'Opposites Ignite';
      let title = 'Contrasting Desires, Wild Potential';
      let summary = `You and your partner experience lust and pacing differently—giving you a blueprint to surprise each other tonight.`;

      if (exactCount >= 4 || pct >= 88) {
        badge = 'Scorching Synchronization';
        title = 'Undeniable Sexual Chemistry';
        summary = `${escapeHtml(state.p1Name)} and ${escapeHtml(state.p2Name)} are on the exact same wavelength—from arousal triggers to afterglow cravings.`;
      } else if (exactCount >= 2 || compCount >= 2 || pct >= 64) {
        badge = 'Magnetic Polarity';
        title = 'Passionate & Complementary';
        summary = `You share core turn-ons alongside thrilling push-pull contrasts where one leads and the other leans in.`;
      }

      return { exactCount, compCount, pct, items, badge, title, summary };
    }

                </button>
              </div>
            </div>

            <button type="button" class="btn-ghost-sm" style="padding: 10px 20px;" onclick="resetToWelcome()">
              ↻ Play Again with 5 New Questions
            </button>
          </div>

          <div class="glass-card">
            <h2 style="font-size: 1.65rem; margin-bottom: 14px;">Side-by-Side Desire Breakdown</h2>
            ${cardsHtml}
          </div>
        </div>
      `;
    }

    /* =========================================================================
       8. DATA VAULT MODAL
       ========================================================================= */
    function openVaultModal() {
      const m = document.getElementById('vault-modal');
      if (m) m.classList.add('open');
      syncVaultFromCloud();
      renderVault();
    }

    function closeVaultModal() {
      const m = document.getElementById('vault-modal');
      if (m) m.classList.remove('open');
    }

    function unlockVault(bypassDemo) {
      if (bypassDemo) {
        state.vaultUnlocked = true;
        renderVault();
        return;
      }
      const inp = document.getElementById('vault-pass-input');
      if (inp && inp.value.trim().toUpperCase() === VAULT_PASSCODE) {
        state.vaultUnlocked = true;
        renderVault();
      } else {
        showToast('Incorrect passcode. Use VELVET2026 or click Preview Live Telemetry.');
      }
    }

    function renderVault() {
      const box = document.getElementById('vault-content');
      if (!box) return;

      if (!state.vaultUnlocked) {
        box.innerHTML = `
          <div style="max-width: 420px; margin: 16px auto; text-align: center;">
            <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 14px;">
              Inspect anonymized cloud &amp; local telemetry rows and export CSV/JSON datasets.
            </p>
            <input
              id="vault-pass-input"
              type="password"
              class="text-input"
              style="text-align: center; font-family: var(--font-mono); margin-bottom: 12px;"
              placeholder="Passcode (VELVET2026)"
              onkeydown="if(event.key==='Enter') unlockVault(false)"
            />
            <div class="btn-row">
              <button type="button" class="btn-primary" onclick="unlockVault(false)">Unlock Vault</button>
              <button type="button" class="btn-secondary" onclick="unlockVault(true)">Preview Live Telemetry</button>
            </div>
          </div>
        `;
        return;
      }

      const rows = readTelemetryRows();
      const completed = rows.filter(r => r.stage === 'couple_compared');
      const avgPct = completed.length
        ? Math.round(completed.reduce((s, r) => s + (Number(r.alignmentPct) || 0), 0) / completed.length)
        : 0;

      const counts = { A: 0, B: 0, C: 0, D: 0 };
      rows.forEach(r => {
        [r.p1Options, r.p2Options].forEach(seq => {
          if (typeof seq === 'string') {
            seq.split('').forEach(ch => { if (counts[ch] !== undefined) counts[ch]++; });
          }
        });
      });
      const archetypeNames = {
        A: 'Bold & Dominant (A)',
        B: 'Sensual & Teasing (B)',
        C: 'Balanced & Mutual (C)',
        D: 'Spontaneous & Primal (D)'
      };
      const topKey = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
      const topArchetype = counts[topKey] > 0 ? archetypeNames[topKey] : 'No data yet';

      const tableBody = rows.length === 0
        ? `<tr><td colspan="6" style="text-align: center; padding: 24px; color: var(--text-dim);">No telemetry rows yet. Complete a session to populate live records!</td></tr>`
        : rows.slice(0, 50).map(r => `
            <tr>
              <td style="font-family: var(--font-mono);">${escapeHtml(r.roomCode || r.sessionId)}</td>
              <td>${escapeHtml(r.stage)}</td>
              <td style="font-family: var(--font-mono);">${escapeHtml((r.questionIds || []).join(','))}</td>
              <td style="font-family: var(--font-mono);">${escapeHtml(r.p1Options || '-')} / ${escapeHtml(r.p2Options || '-')}</td>
              <td>${escapeHtml(r.p1Colour || '-')} &amp; ${escapeHtml(r.p2Colour || '-')}</td>
              <td style="font-weight: 700; color: #6ee7b7;">${r.alignmentPct ? r.alignmentPct + '%' : '-'}</td>
            </tr>
          `).join('');

      box.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim);">Total Records</div>
            <div style="font-size: 1.5rem; font-weight: 700; margin-top: 4px;">${rows.length}</div>
          </div>
          <div class="kpi-card">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim);">Completed Pairs</div>
            <div style="font-size: 1.5rem; font-weight: 700; color: #6ee7b7; margin-top: 4px;">${completed.length}</div>
          </div>
          <div class="kpi-card">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim);">Avg Alignment</div>
            <div style="font-size: 1.5rem; font-weight: 700; color: #fde68a; margin-top: 4px;">${avgPct}%</div>
          </div>
          <div class="kpi-card">
            <div style="font-size: 0.68rem; text-transform: uppercase; color: var(--text-dim);">Top Archetype</div>
            <div style="font-size: 0.85rem; font-weight: 700; color: #fda4af; margin-top: 6px;">${escapeHtml(topArchetype)}</div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
          <span style="font-size: 0.78rem; color: var(--text-muted);">Anonymized raw records (${cloudBridge.mode === 'cloud' ? 'Cloud + Local Synced' : 'Local Storage'})</span>
          <div style="display: flex; gap: 8px;">
            <button type="button" class="btn-primary" style="width: auto; padding: 9px 15px; font-size: 0.8rem;" onclick="downloadTelemetry('csv')">Export CSV</button>
            <button type="button" class="btn-secondary" style="width: auto; padding: 9px 15px; font-size: 0.8rem;" onclick="downloadTelemetry('json')">Export JSON</button>
          </div>
        </div>

        <div style="overflow-x: auto; border: 1px solid var(--border-subtle); border-radius: 14px;">
          <table>
            <thead>
              <tr>
                <th>Room ID</th>
                <th>Stage</th>
                <th>Questions</th>
                <th>Options (P1/P2)</th>
                <th>Colours</th>
                <th>Align %</th>
              </tr>
            </thead>
            <tbody>${tableBody}</tbody>
          </table>
        </div>
      `;
    }

    function downloadTelemetry(fmt) {
      const rows = readTelemetryRows();
      if (!rows.length) {
        showToast('No telemetry rows to export yet.');
        return;
      }
      let content = '';
      let mime = 'application/json';
      let filename = `velvet_ember_telemetry_${Date.now()}.json`;

      if (fmt === 'json') {
        content = JSON.stringify(rows, null, 2);
      } else {
        mime = 'text/csv;charset=utf-8;';
        filename = `velvet_ember_telemetry_${Date.now()}.csv`;
        const cols = ['roomCode', 'timestamp', 'stage', 'questionIds', 'p1Options', 'p2Options', 'p1Colour', 'p2Colour', 'alignmentPct', 'durationSec'];
        const lines = [cols.join(',')];
        rows.forEach(r => {
          lines.push(cols.map(c => {
            const val = Array.isArray(r[c]) ? r[c].join('|') : (r[c] ?? '');
            return `"${String(val).replace(/"/g, '""')}"`;
          }).join(','));
        });
        content = lines.join('\n');
      }

      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${rows.length} rows as ${fmt.toUpperCase()}.`);
    }

    /* =========================================================================
       9. USER INTERACTION & ROOM ROUTING CONTROLLERS
       ========================================================================= */
    function openPrivacyModal() {
      const m = document.getElementById('privacy-modal');
      if (m) m.classList.add('open');
    }

    function closePrivacyModal() {
      const m = document.getElementById('privacy-modal');
      if (m) m.classList.remove('open');
    }

    function wipeActiveSession() {
      closePrivacyModal();
      stopRoomSubscription();
      state.p1Name = '';
      state.p2Name = '';
      state.p1Answers = {};
      state.p2Answers = {};
      state.shareLink = '';
      resetToWelcome();
      showToast('Active session cleared.');
    }

    function shuffleDeck() {
      const nameInp = document.getElementById('p1-name');
      if (nameInp) state.p1Name = nameInp.value;
      state.deckNumber = makeDeckNumber();
      state.deckIds = drawNonRepeatingDeck(state.deckIds);
      render();
      showToast(`Drew Deck #${state.deckNumber}`);
    }

    function pickColour(partnerNum, colId) {
      if (partnerNum === 1) {
        const inp = document.getElementById('p1-name');
        if (inp) state.p1Name = inp.value;
        state.p1Colour = colId;
      } else {
        const inp = document.getElementById('p2-name') || document.getElementById('handoff-p2');
        if (inp) state.p2Name = inp.value;
        state.p2Colour = colId;
      }
      render();
    }

    function beginQuiz(mode) {
      const nameInp = document.getElementById('p1-name');
      const name = (nameInp ? nameInp.value : state.p1Name).trim();
      if (!name) {
        showToast('Please enter your name first.');
        if (nameInp) nameInp.focus();
        return;
      }
      stopRoomSubscription();
      state.p1Name = name;
      state.roomCode = makeRoomCode();
      state.startedAt = Date.now();
      state.mode = mode;
      state.activePartner = 1;
      state.qIndex = 0;
      state.p1Answers = {};
      state.p2Answers = {};
      state.view = 'quiz';
      render();
    }

    function applyCloudRoomSnapshot(data) {
      if (!data || !data.p1Name || !Array.isArray(data.deckIds) || data.deckIds.length !== 5) return;

      state.roomCode = data.roomCode || state.roomCode;
      state.deckNumber = data.deckNumber || state.deckNumber;
      state.deckIds = data.deckIds;
      state.p1Name = String(data.p1Name).slice(0, 28);
      state.p1Colour = COLOURS.some(c => c.id === data.p1Colour) ? data.p1Colour : 'crimson';
      state.p1Answers = {};
      data.deckIds.forEach((qid, idx) => {
        state.p1Answers[qid] = (data.p1Seq || '')[idx];
      });
      state.shareLink = buildDirectRoomUrl(state.roomCode);

      if (data.status === 'completed' && data.p2Name && data.p2Seq && data.p2Seq.length === 5) {
        state.p2Name = String(data.p2Name).slice(0, 28);
        state.p2Colour = COLOURS.some(c => c.id === data.p2Colour) ? data.p2Colour : 'ember';
        state.p2Answers = {};
        data.deckIds.forEach((qid, idx) => {
          state.p2Answers[qid] = data.p2Seq[idx];
        });
        if (state.view !== 'results') {
          state.view = 'results';
          render();
          showToast(`🔥 ${state.p2Name} finished! Results unlocked.`);
        }
        return;
      }

      // If Partner 1 is currently viewing the waiting screen, keep them there
      if (state.view === 'share_invite') return;

      // Otherwise Partner 2 opened the link
      state.mode = 'link';
      state.activePartner = 2;
      state.p2Colour = state.p1Colour === 'ember' ? 'crimson' : 'ember';
      state.view = 'p2_unlock';
      render();
    }

    async function loadRoomByCode(rawCodeOrUrl) {
      let code = String(rawCodeOrUrl || '').trim();
      try {
        if (code.includes('room=')) {
          const u = new URL(code.startsWith('http') ? code : 'https://x.com/?' + code.split('?')[1]);
          code = u.searchParams.get('room') || code;
        }
      } catch (e) {}
      code = code.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
      if (!code) {
        showToast('Enter a valid Room Code or link.');
        return;
      }

      state.roomCode = code;
      state.view = 'loading_room';
      render();

      const data = await cloudFetchRoom(code);
      if (!data) {
        showToast('Room not found yet. Check the link or start a new session.');
        resetToWelcome();
        return;
      }

      try {
        const u = new URL(window.location.href.split('#')[0]);
        u.searchParams.set('room', code);
        window.history.replaceState(null, '', u.toString());
      } catch (e) {}

      applyCloudRoomSnapshot(data);
      subscribeToRoom(code, applyCloudRoomSnapshot);
    }

    async function joinManualRoom() {
      const inp = document.getElementById('manual-code-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) {
        showToast('Paste a room link or code first.');
        return;
      }
      await loadRoomByCode(val);
    }

    function startPartner2Quiz() {
      const inp = document.getElementById('p2-name');
      const name = (inp ? inp.value : state.p2Name).trim();
      if (!name) {
        showToast('Please enter your name first.');
        if (inp) inp.focus();
        return;
      }
      state.p2Name = name;
      state.activePartner = 2;
      state.qIndex = 0;
      state.p2Answers = {};
      state.startedAt = Date.now();
      state.view = 'quiz';
      render();
    }

    function startPartner2Handoff() {
      const inp = document.getElementById('handoff-p2');
      const name = (inp ? inp.value : state.p2Name).trim();
      if (!name) {
        showToast('Please enter Partner 2’s name first.');
        if (inp) inp.focus();
        return;
      }
      state.p2Name = name;
      state.mode = 'same_device';
      state.activePartner = 2;
      state.qIndex = 0;
      state.p2Answers = {};
      state.view = 'quiz';
      render();
    }

    function openPartner2Directly() {
      stopRoomSubscription();
      state.mode = 'same_device';
      state.p2Colour = state.p1Colour === 'ember' ? 'crimson' : 'ember';
      state.view = 'handoff';
      render();
    }

    function chooseOption(letter) {
      const qid = state.deckIds[state.qIndex];
      if (state.activePartner === 1) state.p1Answers[qid] = letter;
      else state.p2Answers[qid] = letter;
      render();
    }

    function goBackQuestion() {
      if (state.qIndex > 0) {
        state.qIndex--;
      } else if (state.activePartner === 2) {
        state.view = state.mode === 'link' ? 'p2_unlock' : 'handoff';
      } else {
        state.view = 'welcome';
      }
      render();
    }

    async function goForwardQuestion() {
      const qid = state.deckIds[state.qIndex];
      const ans = state.activePartner === 1 ? state.p1Answers : state.p2Answers;
      if (!ans[qid]) return;

      if (state.qIndex < 4) {
        state.qIndex++;
        render();
        return;
      }

      const durationSec = Math.max(1, Math.round((Date.now() - state.startedAt) / 1000));
      const p1Seq = state.deckIds.map(id => state.p1Answers[id]).join('');

      if (state.activePartner === 1) {
        state.shareLink = buildDirectRoomUrl(state.roomCode);
        const roomPayload = {
          roomCode: state.roomCode,
          deckNumber: state.deckNumber,
          deckIds: state.deckIds,
          status: 'waiting_p2',
          p1Name: state.p1Name,
          p1Colour: state.p1Colour,
          p1Seq,
          p2Name: '',
          p2Colour: '',
          p2Seq: '',
          updatedAt: Date.now()
        };

        await cloudSaveRoom(state.roomCode, roomPayload);
        recordRawTelemetry({
          roomCode: state.roomCode,
          timestamp: Date.now(),
          stage: 'partner1_sealed',
          questionIds: state.deckIds,
          p1Options: p1Seq,
          p2Options: '',
          p1Colour: state.p1Colour,
          p2Colour: '',
          alignmentPct: 0,
          durationSec
        });

        try {
          window.history.replaceState(null, '', state.shareLink);
        } catch (e) {}

        if (state.mode === 'link') {
          state.view = 'share_invite';
          render();
          subscribeToRoom(state.roomCode, applyCloudRoomSnapshot);
        } else {
          state.p2Colour = state.p1Colour === 'ember' ? 'crimson' : 'ember';
          state.view = 'handoff';
          render();
        }
      } else {
        const res = computeAlignment();
        const p2Seq = state.deckIds.map(id => state.p2Answers[id]).join('');
        state.shareLink = buildDirectRoomUrl(state.roomCode);

        const completedPayload = {
          roomCode: state.roomCode,
          deckNumber: state.deckNumber,
          deckIds: state.deckIds,
          status: 'completed',
          p1Name: state.p1Name,
          p1Colour: state.p1Colour,
          p1Seq,
          p2Name: state.p2Name,
          p2Colour: state.p2Colour,
          p2Seq,
          alignmentPct: res.pct,
          updatedAt: Date.now()
        };

        await cloudSaveRoom(state.roomCode, completedPayload);
        recordRawTelemetry({
          roomCode: state.roomCode,
          timestamp: Date.now(),
          stage: 'couple_compared',
          questionIds: state.deckIds,
          p1Options: p1Seq,
          p2Options: p2Seq,
          p1Colour: state.p1Colour,
          p2Colour: state.p2Colour,
          alignmentPct: res.pct,
          durationSec
        });

        try {
          window.history.replaceState(null, '', state.shareLink);
        } catch (e) {}

        state.view = 'results';
        render();
        subscribeToRoom(state.roomCode, applyCloudRoomSnapshot);
      }
    }

    function resetToWelcome() {
      stopRoomSubscription();
      state.roomCode = makeRoomCode();
      state.deckNumber = makeDeckNumber();
      state.deckIds = drawNonRepeatingDeck(state.deckIds);
      state.view = 'welcome';
      state.mode = 'link';
      state.activePartner = 1;
      state.qIndex = 0;
      state.p1Answers = {};
      state.p2Answers = {};
      state.shareLink = '';
      try {
        const cleanUrl = window.location.pathname;
        window.history.replaceState(null, '', cleanUrl);
      } catch (e) {}
      render();
    }

    /* =========================================================================
       10. NON-BLOCKING FIREBASE CLOUD INIT + SYNCHRONOUS BOOTSTRAP
       ========================================================================= */
    async function initCloudEngine() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          cloudBridge.mode = 'offline';
          updateCloudBadge();
          return;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const [appMod, authMod, fsMod] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
          import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
        ]);

        const app = appMod.initializeApp(firebaseConfig);
        const auth = authMod.getAuth(app);
        const db = fsMod.getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await authMod.signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await authMod.signInAnonymously(auth);
        }

        cloudBridge.db = db;
        cloudBridge.auth = auth;
        cloudBridge.user = auth.currentUser;
        cloudBridge.appId = appId;
        cloudBridge.fns = fsMod;
        cloudBridge.mode = 'cloud';
        updateCloudBadge();

        // Re-check room if opened via ?room= while cloud was initializing
        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get('room');
        if (roomParam) {
          await loadRoomByCode(roomParam);
        }
      } catch (err) {
        cloudBridge.mode = 'offline';
        updateCloudBadge();
      }
    }

    (function bootstrap() {
      // 1. Render UI synchronously on first paint (zero freeze)
      const params = new URLSearchParams(window.location.search);
      const roomParam = params.get('room');
      if (roomParam) {
        state.roomCode = roomParam.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        state.view = 'loading_room';
      }
      render();

      // 2. Immediately attempt local mirror load so Partner 2 sees instant UI if cached
      if (roomParam) {
        const localData = readLocalRooms()[state.roomCode];
        if (localData) {
          applyCloudRoomSnapshot(localData);
          subscribeToRoom(state.roomCode, applyCloudRoomSnapshot);
        }
      }

      // 3. Connect Firebase Firestore asynchronously in background
      initCloudEngine().then(() => {
        if (roomParam && cloudBridge.mode === 'offline' && state.view === 'loading_room') {
          loadRoomByCode(roomParam);
        }
      });
    })();
  </script>
